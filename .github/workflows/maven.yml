name: Java CI with Maven

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Install xvfb
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libgtk-3-0 libxrender1 libxext6 libxtst6 libxrandr2 libxi6 libasound2 libnss3

    - name: Build and Test with Maven (Xvfb)
      working-directory: ./auctionweb
      run: |
        # start X virtual framebuffer and export display
        Xvfb :99 -screen 0 1280x1024x24 &
        export DISPLAY=:99
        mvn -B -Djava.awt.headless=true clean test -Dprism.order=sw
