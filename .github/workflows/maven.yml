name: Java CI with Maven

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Install xvfb
      run: |
        set -eux
        echo '--- apt-get update ---'
        sudo apt-get update -y
        echo '--- apt-get install (no recommends) ---'
        sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libxrender1 libxext6 libxtst6 libxrandr2 libxi6 libasound2 libnss3
        echo '--- dpkg -l (installed GUI packages) ---'
        dpkg -l | egrep 'xvfb|gtk|xrender|xext|xtst|xrandr|xi|asound|nss' || true
        echo '--- apt-cache policy java | head ---'
        apt-cache policy openjdk-17-jdk || true

    - name: Build and Test with Maven (Xvfb)
      working-directory: ./auctionweb
      run: |
        set -eux
        echo 'Start Xvfb on :99'
        Xvfb :99 -screen 0 1280x1024x24 &
        export DISPLAY=:99
        echo 'Environment dump:'
        env | sort
        echo 'Maven version:'
        mvn -v
        echo 'Run mvn with debug flags'
        mvn -B -X -e -Djava.awt.headless=true clean test -Dprism.order=sw | tee mvn-test.log
        echo 'mvn exit code:' $?
        tail -n +1 mvn-test.log | sed -n '1,200p'
